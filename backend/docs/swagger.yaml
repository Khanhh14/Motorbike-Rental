openapi: 3.0.0
info:
  title: Motorbike Rental API
  version: 1.0.0
  description: API Documentation for Motorbike Rental Website
servers:
  - url: http://localhost:5000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      summary: Đăng ký tài khoản mới
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                username: { type: string }
                email: { type: string, example: user@example.com }
                password: { type: string, example: "123456" }
      responses:
        201:
          description: Đăng ký thành công

  /api/auth/login:
    post:
      summary: Đăng nhập hệ thống
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: user@example.com }
                password: { type: string, example: "123456" }
      responses:
        200:
          description: Đăng nhập thành công

  /api/auth/forgot-password:
    post:
      summary: Quên mật khẩu - Gửi mã xác nhận qua Email
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, example: user@example.com }
      responses:
        200:
          description: Đã gửi mã xác nhận thành công
        404:
          description: Email không tồn tại